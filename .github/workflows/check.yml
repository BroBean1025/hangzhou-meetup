name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - run: npm test
      - run: npm run check:release
      - name: Verify Docker deployment paths
        run: |
          node tools/setup.mjs
          docker compose -f tools/docker/compose.yaml config --quiet
          docker build -f tools/docker/Dockerfile -t hangzhou-meetup-check .
          docker run --rm hangzhou-meetup-check node --input-type=module -e "await import('./core/server.mjs'); console.log('Core service imports verified')"
# No secrets and no live provider requests are needed for these checks.
