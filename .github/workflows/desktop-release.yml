name: Windows desktop release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-desktop-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Assign a unique increasing desktop version
        id: version
        run: node scripts/prepare-desktop-release.mjs
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run check:release
      - name: Build installer, portable EXE and update manifest
        run: pnpm exec electron-builder --win nsis portable --x64 --publish never
      - name: Verify update manifest and package
        run: node scripts/check-desktop-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ steps.version.outputs.version }}
          path: |
            desktop-output/*.exe
            desktop-output/*.blockmap
            desktop-output/latest.yml
          retention-days: 7
      - name: Publish a complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $existing = gh release view $env:RELEASE_TAG --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { Write-Output 'This version is already published; preserving its assets.'; exit 0 }
            if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Existing draft belongs to a different commit' }
          } else {
            $notes = "杭城同行 Windows 桌面版 $env:RELEASE_VERSION`n`n构建自提交 $env:GITHUB_SHA。`n安装版支持每日首次打开自动检查，以及程序内手动下载、重启安装。`n高德 Key 与个人设置保留在本机，不包含在发布文件中。`n免安装版可在程序内检查并下载新版 EXE。"
            $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "杭城同行 $env:RELEASE_VERSION" --notes-file release-notes.txt
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem desktop-output -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft remains unpublished' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
